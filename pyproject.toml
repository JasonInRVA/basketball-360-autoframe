[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "basketball-360-autoframe"
version = "0.1.0"
description = "Auto-reframe Insta360 X4 360° basketball video into standard rectangular video for YouTube"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jason Sewell" },
]
keywords = ["basketball", "360-video", "auto-reframe", "insta360", "yolo"]
dependencies = [
    "ultralytics>=8.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "typer[all]>=0.12",
    "rich>=13.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
autoframe = "autoframe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autoframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "-x", "--tb=short"]
markers = [
    "slow: tests that process video",
    "integration: tests requiring FFmpeg or GPU",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["autoframe"]
